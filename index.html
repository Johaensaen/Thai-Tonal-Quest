<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Thai Tonal Quest</title>
    <!-- Verknüpfung zum echten Web App Manifest -->
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="./icon-192.png">
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --text: #f8fafc;
            --muted: #94a3b8;
            --correct: #10b981;
            --wrong: #ef4444;
            --streak: #f97316;
            --xp: #eab308;
            --rising: #a855f7;
            --falling: #f43f5e;
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #334155;
            z-index: 10;
            flex-shrink: 0;
        }

        .hud-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: bold;
            font-size: 0.9rem;
        }

        main {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 16px 16px 80px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 500px;
            width: 100%;
            margin: 0 auto;
            box-sizing: border-box;
            position: relative;
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            border: 1px solid #334155;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
        }

        .vocab-emoji-card {
            font-size: 3.5rem;
            margin-bottom: 10px;
        }

        .word-row {
            display: flex;
            align-items: center;
            gap: 12px;
            justify-content: center;
            margin-bottom: 5px;
        }

        .thai-word {
            font-size: 2.8rem;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .translit {
            color: var(--accent);
            font-size: 1.1rem;
            margin-bottom: 15px;
            font-weight: 500;
        }

        .audio-btn {
            background: var(--accent);
            border: none;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.2rem;
            transition: transform 0.1s;
            box-shadow: 0 4px 10px rgba(56, 189, 248, 0.3);
        }
        .audio-btn:active { transform: scale(0.92); }

        .canvas-container {
            width: 100%;
            height: 180px;
            background: #0f172a;
            border-radius: 12px;
            border: 2px dashed #475569;
            position: relative;
            margin: 10px 0 20px 0;
            box-sizing: border-box;
            overflow: hidden;
            touch-action: none;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
            cursor: crosshair;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        .action-btn {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            border: none;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            background: #334155;
            color: var(--text);
            transition: background 0.2s;
            text-align: center;
        }
        .action-btn:active { opacity: 0.8; }
        .btn-primary {
            background: var(--correct);
            color: white;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        .choice-btn {
            width: 100%;
            margin-bottom: 8px;
            background: #283548;
            border: 1px solid #475569;
            text-align: left;
            padding: 12px 16px;
            border-radius: 10px;
            color: var(--text);
            font-size: 1rem;
            cursor: pointer;
        }
        .choice-btn:hover { background: #334155; }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            display: flex;
            background: rgba(30, 41, 59, 0.98);
            backdrop-filter: blur(12px);
            border-top: 1px solid #334155;
            padding: 8px 4px env(safe-area-inset-bottom, 8px) 4px;
            justify-content: space-around;
            z-index: 100;
            box-sizing: border-box;
        }

        .nav-btn {
            background: none;
            border: none;
            color: var(--muted);
            font-size: 0.7rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            flex: 1;
            padding: 4px 0;
        }
        .nav-btn.active { color: var(--accent); font-weight: bold; }

        .path-nodes {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            width: 100%;
            padding: 20px 0;
        }

        .path-node {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            box-shadow: 0 6px 15px rgba(0,0,0,0.3);
            transition: transform 0.1s;
            border: 4px solid rgba(255,255,255,0.1);
        }
        .path-node:active { transform: scale(0.95); }
        .path-node.completed { background: linear-gradient(135deg, #f59e0b, #d97706); border-color: #fbbf24; }
        .path-node.active { background: linear-gradient(135deg, #38bdf8, #0284c7); border-color: #7dd3fc; }
        .path-node.locked { background: #334155; border-color: #475569; opacity: 0.7; cursor: not-allowed; }

        .node-icon { font-size: 1.8rem; }
        .node-title {
            position: absolute;
            bottom: -22px;
            font-size: 0.7rem;
            white-space: nowrap;
            color: var(--text);
            font-weight: bold;
            background: rgba(15, 23, 42, 0.8);
            padding: 2px 6px;
            border-radius: 4px;
        }

        .lesson-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 14px;
            width: 100%;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #334155;
            box-sizing: border-box;
        }

        .dialog-bubble {
            background: #1e293b;
            border-left: 4px solid var(--accent);
            padding: 12px;
            border-radius: 0 10px 10px 0;
            margin-bottom: 10px;
            width: 100%;
            box-sizing: border-box;
        }

        .chineasy-graphic {
            width: 90px;
            height: 90px;
            background: rgba(56, 189, 248, 0.08);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin: 0 auto 8px auto;
            border: 2px dashed rgba(56, 189, 248, 0.3);
        }

        .toast-banner {
            position: fixed;
            top: -70px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--correct);
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: bold;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            transition: top 0.3s ease-in-out;
            z-index: 9999;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .toast-banner.show { top: 20px; }
        .toast-banner.wrong { background: var(--wrong); }

        .hidden { display: none !important; }

        .progress-bar-container {
            width: 100%;
            background: #334155;
            height: 8px;
            border-radius: 4px;
            margin-bottom: 15px;
            overflow: hidden;
        }
        .progress-bar-fill {
            background: var(--correct);
            height: 100%;
            width: 0%;
            transition: width 0.3s;
        }
    </style>
</head>
<body onclick="closeTooltipOutside(event)">

    <div id="toast-banner" class="toast-banner">
        <span id="toast-icon">🎉</span>
        <span id="toast-text">Richtig!</span>
    </div>

    <header>
        <div class="hud-item" style="color: var(--xp);">
            ⭐ <span id="xp-count">0</span> XP
        </div>
        <div class="hud-item" style="color: var(--streak);">
            🔥 <span id="streak-count">1</span>
        </div>
        <div class="hud-item" style="color: var(--accent);">
            🏆 Lvl <span id="level-num">1</span>
        </div>
    </header>

    <main>
        <section id="section-path" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
            <div style="text-align: center; margin-bottom: 10px;">
                <h2 style="margin: 0; font-size: 1.2rem;">Dein Thai-Lernpfad</h2>
                <p style="color: var(--muted); font-size: 0.8rem; margin: 4px 0 0 0;">Wähle deine nächste Station oder Dialog-Übung.</p>
            </div>
            <div class="path-nodes" id="path-nodes-container"></div>
        </section>

        <section id="section-mix" class="hidden" style="width: 100%;">
            <div class="progress-bar-container">
                <div class="progress-bar-fill" id="session-fill"></div>
            </div>
            <div class="card" id="card-content-mix"></div>
        </section>

        <section id="section-dialog" class="hidden" style="width: 100%;">
            <div class="card" id="card-content-dialog"></div>
        </section>

        <section id="section-train" class="hidden" style="width: 100%;">
            <div class="card" id="card-content-train"></div>
        </section>

        <section id="section-exam" class="hidden" style="width: 100%;">
            <div class="card" id="card-content-exam"></div>
        </section>

        <section id="section-lessons" class="hidden" style="width: 100%;">
            <h3 style="margin-top:0; color: var(--accent);">📚 Alle Lektionen</h3>
            <div id="lessons-container" style="width: 100%;"></div>
        </section>

        <section id="section-alphabet" class="hidden" style="width: 100%; overflow-y: auto; padding-bottom: 20px;">
            <div id="alphabet-container" style="width: 100%;"></div>
        </section>

        <section id="section-add" class="hidden" style="width: 100%;">
            <div class="card" style="align-items: stretch;">
                <h3 style="margin-top:0; text-align:center; color: var(--accent);">✍️ Eigenes Wort hinzufügen</h3>
                <form id="add-form" onsubmit="addVocab(event)" style="display:flex; flex-direction:column; gap:10px;">
                    <label style="font-size:0.8rem; color:var(--muted);">Thailändisches Schriftbild:</label>
                    <input type="text" id="input-thai" required style="padding:10px; border-radius:8px; border:1px solid #475569; background:#0f172a; color:#fff;">
                    
                    <label style="font-size:0.8rem; color:var(--muted);">Umschrift (Transliteration):</label>
                    <input type="text" id="input-translit" required style="padding:10px; border-radius:8px; border:1px solid #475569; background:#0f172a; color:#fff;">
                    
                    <label style="font-size:0.8rem; color:var(--muted);">Deutsche Bedeutung:</label>
                    <input type="text" id="input-meaning" required style="padding:10px; border-radius:8px; border:1px solid #475569; background:#0f172a; color:#fff;">
                    
                    <label style="font-size:0.8rem; color:var(--muted);">Emoji-Symbol:</label>
                    <input type="text" id="input-image" placeholder="z.B. 🐘" style="padding:10px; border-radius:8px; border:1px solid #475569; background:#0f172a; color:#fff;">

                    <label style="font-size:0.8rem; color:var(--muted);">Lektion (1-3):</label>
                    <input type="number" id="input-lesson" value="1" min="1" max="3" style="padding:10px; border-radius:8px; border:1px solid #475569; background:#0f172a; color:#fff;">

                    <label style="font-size:0.8rem; color:var(--muted);">Ton (0=Mid, 1=Low, 2=Falling, 3=High, 4=Rising):</label>
                    <input type="number" id="input-tone" value="0" min="0" max="4" style="padding:10px; border-radius:8px; border:1px solid #475569; background:#0f172a; color:#fff;">

                    <button type="submit" class="action-btn btn-primary" style="margin-top:10px;">Speichern 🚀</button>
                </form>
            </div>
        </section>

        <section id="section-complete" class="hidden" style="width: 100%; text-align: center; justify-content: center; align-items: center; padding-top: 40px;">
            <div style="font-size: 5rem; margin-bottom: 10px;">🎉</div>
            <h2 style="color: var(--correct); font-size: 1.8rem; margin-top:0;">Station erfolgreich gemeistert!</h2>
            <p style="color: var(--muted); margin-bottom: 20px;">Du hast diesen Abschnitt abgeschlossen.</p>
            <div class="card" style="background: #283548; padding: 15px; margin-bottom: 25px;">
                <div style="font-size: 0.9rem; color: var(--muted);">Erhaltene XP</div>
                <div style="font-size: 2rem; font-weight: bold; color: var(--xp);" id="summary-xp">+100</div>
            </div>
            <button class="action-btn btn-primary" onclick="switchTab('path')" style="width: 100%; padding: 14px;">Zurück zum Pfad ➔</button>
        </section>
    </main>

    <nav class="bottom-nav">
        <button class="nav-btn active" onclick="switchTab('path')">
            <span>🗺️</span> Pfad
        </button>
        <button class="nav-btn" onclick="switchTab('train')">
            <span>🏋️</span> Training
        </button>
        <button class="nav-btn" onclick="switchTab('exam')">
            <span>🎓</span> Prüfung
        </button>
        <button class="nav-btn" onclick="switchTab('lessons')">
            <span>📚</span> Lektionen
        </button>
        <button class="nav-btn" onclick="switchTab('alphabet')">
            <span>🔤</span> Alphabet
        </button>
        <button class="nav-btn" onclick="switchTab('add')">
            <span>➕</span> Wort
        </button>
    </nav>

    <script>
        // Service Worker Registrierung für echte App-Installation
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW registration failed:', err));
            });
        }

        let defaultVocabs = [
            { thai: "สวัสดี", translit: "sà-wàt-dee", meaning: "Hallo / Guten Tag", tone: 3, lesson: 1, emoji: "👋" },
            { thai: "ขอบคุณ", translit: "kàwp-kun", meaning: "Danke", tone: 2, lesson: 1, emoji: "🙏" },
            { thai: "ใช่", translit: "châi", meaning: "Ja", tone: 2, lesson: 1, emoji: "✅" },
            { thai: "ไม่", translit: "mâi", meaning: "Nein / Nicht", tone: 2, lesson: 1, emoji: "❌" },
            { thai: "ห้องน้ำ", translit: "hɔ̂ng-náam", meaning: "Toilette / WC", tone: 2, lesson: 1, emoji: "🚻" },
            { thai: "เท่าไหร่", translit: "thâo-ràai", meaning: "Wieviel kostet das?", tone: 1, lesson: 1, emoji: "💰" },
            { thai: "น้ำ", translit: "náam", meaning: "Wasser", tone: 3, lesson: 2, emoji: "💧" },
            { thai: "กิน", translit: "gin", meaning: "essen", tone: 0, lesson: 2, emoji: "🍚" },
            { thai: "หิว", translit: "hǐw", meaning: "hungrig", tone: 4, lesson: 2, emoji: "😋" },
            { thai: "อร่อย", translit: "à-rɔ̀y", meaning: "Lecker!", tone: 1, lesson: 2, emoji: "🍲" },
            { thai: "เผ็ด", translit: "phèt", meaning: "Scharf", tone: 1, lesson: 2, emoji: "🔥" },
            { thai: "ไม่เผ็ด", translit: "mâi-phèt", meaning: "Nicht scharf", tone: 2, lesson: 2, emoji: "🥛" },
            { thai: "เพื่อน", translit: "phûan", meaning: "Freund / Freundin", tone: 2, lesson: 3, emoji: "🧑‍🤝‍🧑" },
            { thai: "ครอบครัว", translit: "krɔ̀ːp-krūa", meaning: "Familie", tone: 1, lesson: 3, emoji: "👨‍👩‍👧‍👦" },
            { thai: "สบายดีไหม", translit: "sà-baai-dee mǎai", meaning: "Wie geht es dir?", tone: 0, lesson: 3, emoji: "💬" },
            { thai: "สบายดี", translit: "sà-baai-dee", meaning: "Mir geht es gut", tone: 0, lesson: 3, emoji: "😊" },
            { thai: "รัก", translit: "rák", meaning: "Liebe / Lieben", tone: 4, lesson: 3, emoji: "❤️" }
        ];

        let defaultLetters = [
            { char: "ก", name: "Ko Kai", meaning: "Huhn (ก)", class: "middle", mnem: "Hühnerkopf mit Schnabel.", graphic: "🐔" },
            { char: "ไข่", name: "Kho Khai", meaning: "Ei (ไข่)", class: "high", mnem: "Ein Ei mit Schleife oben.", graphic: "🥚" },
            { char: "ช", name: "Cho Chang", meaning: "Elefant (ช)", class: "low", mnem: "Geschwungener Elefantenrüssel.", graphic: "🐘" },
            { char: "ม", name: "Mo Ma", meaning: "Pferd (ม)", class: "low", mnem: "Steht auf vier Hufen wie ein Pferd.", graphic: "🐴" },
            { char: "ส", name: "So Sua", meaning: "Tiger (ส)", class: "high", mnem: "Die Raubkatzen-Kurve.", graphic: "🐅" },
            { char: "น", name: "No Nu", meaning: "Maus (น)", class: "low", mnem: "Winkende Maus.", graphic: "🐭" }
        ];

        let vocabs = JSON.parse(localStorage.getItem('thai_quest_vocabs'));
        if (!vocabs || !Array.isArray(vocabs) || vocabs.length === 0) {
            vocabs = defaultVocabs;
            localStorage.setItem('thai_quest_vocabs', JSON.stringify(vocabs));
        }

        let letters = JSON.parse(localStorage.getItem('thai_quest_letters')) || defaultLetters;

        let lessons = JSON.parse(localStorage.getItem('thai_quest_lessons')) || {
            1: { name: "1. Urlaub & Begrüßung", completed: false },
            2: { name: "2. Essen & Restaurant", completed: false },
            3: { name: "3. Familie & Freunde", completed: false }
        };

        let dialogues = [
            {
                title: "Im Restaurant bestellen",
                context: "Du kommst in ein Restaurant, bestellst Wasser und besprichst die Schärfe.",
                lines: [
                    { speaker: "Kellner", thai: "สวัสดีครับ", translit: "sà-wàt-dee kráp", meaning: "Guten Tag!" },
                    { speaker: "Du", thai: "ขอ N น้ำครับ", translit: "kǎw náam kráp", meaning: "Ich hätte gerne Wasser, bitte." },
                    { speaker: "Kellner", thai: "กินเผ็ดไหม", translit: "gin phèt mǎai", meaning: "Isst du scharf?" },
                    { speaker: "Du", thai: "ไม่เผ็ดครับ", translit: "mâi phèt kráp", meaning: "Nicht scharf, bitte." }
                ],
                question: "Was bestellt und verlangt der Gast?",
                options: [
                    { text: "Wasser und Essen ohne Schärfe", correct: true },
                    { text: "Sehr scharfe Suppe und Cola", correct: false },
                    { text: "Die Rechnung für die Toilette", correct: false }
                ]
            },
            {
                title: "Wiedersehen unter Freunden",
                context: "Du triffst einen alten Bekannten und wirst nach deinem Befinden gefragt.",
                lines: [
                    { speaker: "Freund", thai: "สวัสดีครับเพื่อน", translit: "sà-wàt-dee kráp phûan", meaning: "Hallo mein Freund!" },
                    { speaker: "Freund", thai: "สบายดีไหม", translit: "sà-baai-dee mǎai", meaning: "Wie geht es dir?" },
                    { speaker: "Du", thai: "สบายดี ขอบคุณครับ", translit: "sà-baai-dee kàwp-kun kráp", meaning: "Mir geht es gut, danke." },
                    { speaker: "Freund", thai: "ดีมากครับ", translit: "dee mâak kráp", meaning: "Sehr gut!" }
                ],
                question: "Worüber unterhalten sich die beiden zu Beginn?",
                options: [
                    { text: "Wie es dem anderen geht", correct: true },
                    { text: "Wo es das beste Restaurant gibt", correct: false },
                    { text: "Wie viel das Wasser kostet", correct: false }
                ]
            }
        ];

        const toneDetails = {
            0: { name: "Mittelton (Mid)", path: "M 10 35 L 90 35" },
            1: { name: "Tiefton (Low)", path: "M 10 20 L 90 60" },
            2: { name: "Fallender Ton (Falling)", path: "M 10 50 Q 50 10 90 55" },
            3: { name: "Hochton (High)", path: "M 10 20 L 90 20" },
            4: { name: "Steigender Ton (Rising)", path: "M 10 55 Q 50 55 90 15" }
        };

        let streakExtendedToday = false;

        function checkDailyReset() {
            const todayStr = new Date().toDateString();
            const lastActiveDate = localStorage.getItem('thai_quest_last_date');

            if (lastActiveDate !== todayStr) {
                for (let id in lessons) { lessons[id].completed = false; }
                localStorage.setItem('thai_quest_lessons', JSON.stringify(lessons));
                localStorage.setItem('thai_quest_dialogs', JSON.stringify({})); 
                
                let currentStreak = parseInt(localStorage.getItem('thai_quest_streak')) || 1;
                if (lastActiveDate) {
                    const lastDateObj = new Date(lastActiveDate);
                    const currentDateObj = new Date(todayStr);
                    const diffDays = Math.ceil(Math.abs(currentDateObj - lastDateObj) / (1000 * 60 * 60 * 24));
                    if (diffDays === 1) { currentStreak++; streakExtendedToday = true; }
                    else if (diffDays > 1) { currentStreak = 1; }
                } else { currentStreak = 1; }
                streak = currentStreak;
                localStorage.setItem('thai_quest_streak', streak);
                localStorage.setItem('thai_quest_last_date', todayStr);
            }
        }

        function getVocabEmoji(v) {
            if (v.emoji && v.emoji !== "🇹🇭" && v.emoji.trim() !== "") return v.emoji;
            const m = (v.meaning || "").toLowerCase();
            if (m.includes("hallo") || m.includes("tag")) return "👋";
            if (m.includes("danke")) return "🙏";
            if (m.includes("ja")) return "✅";
            if (m.includes("nein") || m.includes("nicht")) return "❌";
            if (m.includes("toilette") || m.includes("wc")) return "🚻";
            if (m.includes("wieviel")) return "💰";
            if (m.includes("wasser")) return "💧";
            if (m.includes("essen")) return "🍚";
            if (m.includes("hungrig")) return "😋";
            if (m.includes("lecker")) return "🍲";
            if (m.includes("scharf")) return "🔥";
            if (m.includes("freund")) return "🧑‍🤝‍🧑";
            if (m.includes("familie")) return "👨‍👩‍👧‍👦";
            return "💬";
        }

        let synth = window.speechSynthesis;
        let thaiVoice = null;
        function loadThaiVoices() {
            if (!synth) return;
            const voices = synth.getVoices();
            thaiVoice = voices.find(v => v.lang.includes('th') || v.lang.includes('TH')) || null;
        }
        if (synth) {
            loadThaiVoices();
            if (synth.onvoiceschanged !== undefined) synth.onvoiceschanged = loadThaiVoices;
        }

        function playAudio(text) {
            if (!synth) return;
            synth.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'th-TH';
            utterance.rate = 0.8;
            if (!thaiVoice) loadThaiVoices();
            if (thaiVoice) utterance.voice = thaiVoice;
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            synth.speak(utterance);
        }

        let audioCtx = null;
        function getAudioContext() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        function playSound(type) {
            try {
                const ctx = getAudioContext();
                const now = ctx.currentTime;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                if (type === 'correct') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, now);
                    osc.frequency.setValueAtTime(659.25, now + 0.08);
                    osc.frequency.setValueAtTime(783.99, now + 0.16);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
                    osc.start(now); osc.stop(now + 0.35);
                } else if (type === 'wrong') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(180, now);
                    osc.frequency.linearRampToValueAtTime(120, now + 0.2);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
                    osc.start(now); osc.stop(now + 0.25);
                }
            } catch(e) {}
        }

            banner.className = "toast-banner " + (isCorrect ? "" : "wrong");
            icon.innerText = isCorrect ? "🎉" : "💡";
            msg.innerText = text;
            banner.classList.add('show');

        function advanceSession(earnedXP) {

            const fill = document.getElementById('session-fill');
            if(fill) fill.style.width = ((sessionCurrent / sessionTarget) * 100) + "%";
            if (sessionCurrent >= sessionTarget) {
                if (activeLessonFilter && lessons[activeLessonFilter]) {

                    localStorage.setItem('thai_quest_lessons', JSON.stringify(lessons));
                }
                document.getElementById('section-mix').classList.add('hidden');
                document.getElementById('section-complete').classList.remove('hidden');
                document.getElementById('summary-xp').innerText = "+" + sessionGainedXP;

        function switchTab(tab) {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            ['section-path', 'section-mix', 'section-dialog', 'section-complete', 'section-train', 'section-exam', 'section-lessons', 'section-alphabet', 'section-add'].forEach(id => {
                const el = document.getElementById(id);
                if(el) el.classList.add('hidden');
            });
            const navButtons = document.querySelectorAll('.bottom-nav .nav-btn');
            navButtons.forEach(btn => { if(btn.getAttribute('onclick') && btn.getAttribute('onclick').includes(tab)) btn.classList.add('active'); });

            if(tab === 'path') { document.getElementById('section-path').classList.remove('hidden'); updateHUD(); renderPath(); }
            else if(tab === 'mix') { document.getElementById('section-mix').classList.remove('hidden'); loadRandomMixMission(); }
            else if(tab === 'train') { document.getElementById('section-train').classList.remove('hidden'); loadTrainCard(); }
            else if(tab === 'exam') { document.getElementById('section-exam').classList.remove('hidden'); loadExamCard(); }
            else if(tab === 'lessons') { document.getElementById('section-lessons').classList.remove('hidden'); renderLessons(); }

        function loadRandomMixMission() {
            updateHUD();

            if (!container) return;
            let availableVocabs = vocabs;
            if (activeLessonFilter) {
                availableVocabs = vocabs.filter(v => v.lesson == activeLessonFilter);
                if (!availableVocabs || availableVocabs.length === 0) availableVocabs = vocabs;
            }
            const missionTypes = ['train_canvas', 'exam_canvas', 'audio_mc', 'tone_match', 'emoji_match', 'mnem_match'];
            const chosenType = missionTypes[Math.floor(Math.random() * missionTypes.length)];

            if (chosenType === 'mnem_match' && letters.length > 0) { renderMixMnemMatch(); return; }

            currentMixIndex = Math.floor(Math.random() * availableVocabs.length);
            const v = availableVocabs[currentMixIndex];
            setTimeout(() => playAudio(v.thai), 350);

            if (chosenType === 'train_canvas') renderMixTrainCanvas(v);
            else if (chosenType === 'exam_canvas') renderMixExamCanvas(v);
            else if (chosenType === 'audio_mc') renderMixAudioMC(v, availableVocabs);
            else if (chosenType === 'tone_match') renderMixToneMatch(v);
            else if (chosenType === 'emoji_match') renderMixEmojiMatch(v, availableVocabs);
        }

            setupMixExamCanvas('mixExamCanvas');

        function setupMixExamCanvas(canvasId) {
            const canvas = document.getElementById(canvasId);
            if(!canvas) return;
            const ctx = canvas.getContext('2d');
            canvas.width = canvas.parentElement.clientWidth; canvas.height = canvas.parentElement.clientHeight;
            examPoints = [];
            const getCoord = (e) => { const r = canvas.getBoundingClientRect(); return { x: (e.clientX || e.touches[0].clientX) - r.left, y: (e.clientY || e.touches[0].clientY) - r.top }; };
            canvas.onmousedown = (e) => { examPoints = [getCoord(e)]; examDrawingActive = true; };
            canvas.onmousemove = (e) => { if(examDrawingActive) { examPoints.push(getCoord(e)); redrawExamCanvas(ctx, canvas); } };
            canvas.onmouseup = () => { examDrawingActive = false; };
            canvas.ontouchstart = (e) => { examPoints = [getCoord(e.touches[0])]; examDrawingActive = true; e.preventDefault(); };
            canvas.ontouchmove = (e) => { if(examDrawingActive) { examPoints.push(getCoord(e.touches[0])); redrawExamCanvas(ctx, canvas); e.preventDefault(); } };
            canvas.ontouchend = () => { examDrawingActive = false; };
        }

        function redrawExamCanvas(ctx, canvas) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (examPoints.length < 2) return;
            ctx.beginPath(); ctx.moveTo(examPoints[0].x, examPoints[0].y);
            for(let p of examPoints) ctx.lineTo(p.x, p.y);
            ctx.strokeStyle = '#f8fafc'; ctx.lineWidth = 4; ctx.stroke();
        }

        function checkMixExamDrawing() {
            if (examPoints.length < 5) { playSound('wrong'); showToast("Bitte zeichne die Kurve!", false); return; }
            playSound('correct'); showToast("Richtig gezeichnet! 🎉 +25 XP", true); advanceSession(25);
        }

        function renderMixEmojiMatch(v, pool) {
            let options = [v];

                let rv = pool[Math.floor(Math.random() * pool.length)];
                if(!options.includes(rv)) options.push(rv);

            options.forEach(opt => {
                htmlEmojis += `<div onclick="checkEmojiMatch(${opt.thai === v.thai})" style="cursor:pointer; border-radius:10px; padding:10px; text-align:center; border:2px solid #475569; background:#283548;"><div style="font-size:2rem;">${getVocabEmoji(opt)}</div><div style="font-size:0.75rem; color:#f8fafc;">${opt.meaning}</div></div>`;

        function checkEmojiMatch(isCorrect) {
            if(isCorrect) { playSound('correct'); showToast("Richtig! 🎉 +15 XP", true); advanceSession(15); }
            else { playSound('wrong'); showToast("Falsch! 💡", false); }

        function setupMixCanvas(canvasId, tone, hasGhost) {
            const canvas = document.getElementById(canvasId);
            if(!canvas) return;
            const ctx = canvas.getContext('2d');
            canvas.width = canvas.parentElement.clientWidth; canvas.height = canvas.parentElement.clientHeight;
            let points = []; let isDrawing = false;
            if(hasGhost) drawGhost(ctx, canvas, tone);
            const getCoord = (e) => { const r = canvas.getBoundingClientRect(); return { x: (e.clientX || e.touches[0].clientX) - r.left, y: (e.clientY || e.touches[0].clientY) - r.top }; };
            canvas.onmousedown = (e) => { isDrawing = true; points = [getCoord(e)]; };
            canvas.onmousemove = (e) => { if(!isDrawing) return; points.push(getCoord(e)); redrawCanvas(ctx, canvas, points, tone, hasGhost, false); };
            canvas.onmouseup = () => { if(!isDrawing) return; isDrawing = false; if(hasGhost && points.length > 3) { drawPerfectCurve(ctx, canvas, tone); playAudio(vocabs[currentMixIndex].thai); } };
            canvas.ontouchstart = (e) => { isDrawing = true; points = [getCoord(e.touches[0])]; e.preventDefault(); };
            canvas.ontouchmove = (e) => { if(!isDrawing) return; points.push(getCoord(e.touches[0])); redrawCanvas(ctx, canvas, points, tone, hasGhost, false); e.preventDefault(); };
            canvas.ontouchend = () => { if(!isDrawing) return; isDrawing = false; if(hasGhost && points.length > 3) { drawPerfectCurve(ctx, canvas, tone); playAudio(vocabs[currentMixIndex].thai); } };
        }

        function redrawCanvas(ctx, canvas, points, tone, hasGhost, snapped) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if(hasGhost) drawGhost(ctx, canvas, tone);
            if(points.length < 2) return;
            ctx.beginPath(); ctx.moveTo(points[0].x, points[0].y);
            for(let p of points) ctx.lineTo(p.x, p.y);
            ctx.strokeStyle = snapped ? '#10b981' : '#38bdf8'; ctx.lineWidth = 4; ctx.stroke();
        }

        function loadTrainCard() {
            updateHUD();
            if (!vocabs || vocabs.length === 0) return;
            currentTrainIndex = Math.floor(Math.random() * vocabs.length);
            const v = vocabs[currentTrainIndex];
            trainSnapped = false;
            setTimeout(() => playAudio(v.thai), 300);
            document.getElementById('card-content-train').innerHTML = `<div style="font-size: 0.8rem; color: #38bdf8;">🏋️ Training (Mit Ghost-Linie)</div>
                <div class="vocab-emoji-card">${getVocabEmoji(v)}</div>
                <div class="word-row"><div class="thai-word">${v.thai}</div><button class="audio-btn" onclick="playAudio('${v.thai}')">🔊</button></div>
                <div class="translit">${v.translit}</div>
                <div class="canvas-container"><canvas id="trainCanvas"></canvas></div>
                <div class="btn-group"><button class="action-btn" onclick="clearTrainCanvas()">Löschen</button><button class="action-btn btn-primary" onclick="checkTrainDrawing()">Richtig ➔</button></div>`;
            setupTrainCanvas();
        }

        function setupTrainCanvas() {
            trainCanvas = document.getElementById('trainCanvas');
            trainCtx = trainCanvas.getContext('2d');
            trainCanvas.width = trainCanvas.parentElement.clientWidth; trainCanvas.height = trainCanvas.parentElement.clientHeight;
            trainPoints = []; trainSnapped = false;
            const getCoord = (e) => { const r = trainCanvas.getBoundingClientRect(); return { x: (e.clientX || e.touches[0].clientX) - r.left, y: (e.clientY || e.touches[0].clientY) - r.top }; };
            trainCanvas.onmousedown = (e) => { trainPoints = [getCoord(e)]; trainSnapped = false; redrawTrain(); };
            trainCanvas.onmousemove = (e) => { if(trainPoints.length) { trainPoints.push(getCoord(e)); redrawTrain(); } };
            trainCanvas.onmouseup = () => { if(trainPoints.length > 3) { drawPerfectCurve(trainCtx, trainCanvas, vocabs[currentTrainIndex].tone); trainSnapped = true; playAudio(vocabs[currentTrainIndex].thai); } };
            trainCanvas.ontouchstart = (e) => { trainPoints = [getCoord(e.touches[0])]; trainSnapped = false; redrawTrain(); e.preventDefault(); };
            trainCanvas.ontouchmove = (e) => { if(trainPoints.length) { trainPoints.push(getCoord(e.touches[0])); redrawTrain(); e.preventDefault(); } };
            trainCanvas.ontouchend = () => { if(trainPoints.length > 3) { drawPerfectCurve(trainCtx, trainCanvas, vocabs[currentTrainIndex].tone); trainSnapped = true; playAudio(vocabs[currentTrainIndex].thai); } };
            drawGhost(trainCtx, trainCanvas, vocabs[currentTrainIndex].tone);
        }

        function clearTrainCanvas() { trainPoints = []; trainSnapped = false; redrawTrain(); }
        function redrawTrain() {
            trainCtx.clearRect(0, 0, trainCanvas.width, trainCanvas.height);
            drawGhost(trainCtx, trainCanvas, vocabs[currentTrainIndex].tone);
            if (trainPoints.length < 2) return;
            trainCtx.beginPath(); trainCtx.moveTo(trainPoints[0].x, trainPoints[0].y);
            for(let p of trainPoints) trainCtx.lineTo(p.x, p.y);
            trainCtx.strokeStyle = trainSnapped ? '#10b981' : '#38bdf8'; trainCtx.lineWidth = 4; trainCtx.stroke();
        }

        function checkTrainDrawing() {
            if (!trainSnapped && trainPoints.length < 3) { playSound('wrong'); showToast("Bitte Kurve einzeichnen!", false); return; }
            playSound('correct'); xp += 10; showToast("Super trainiert! +10 XP", true); loadTrainCard();
        }

        function loadExamCard() {
            updateHUD();
            if (!vocabs || vocabs.length === 0) return;
            currentExamIndex = Math.floor(Math.random() * vocabs.length);
            const v = vocabs[currentExamIndex];
            setTimeout(() => playAudio(v.thai), 300);
            document.getElementById('card-content-exam').innerHTML = `<div style="font-size: 0.8rem; color: #ef4444;">🎓 Prüfung (Aus dem Gedächtnis)</div>
                <div class="vocab-emoji-card">${getVocabEmoji(v)}</div>
                <div class="word-row"><div class="thai-word">${v.thai}</div><button class="audio-btn" onclick="playAudio('${v.thai}')">🔊</button></div>
                <div class="translit">${v.translit}</div>
                <div class="canvas-container" style="border-color: #ef4444;"><canvas id="examCanvas"></canvas></div>
                <div class="btn-group"><button class="action-btn" onclick="clearExamCanvas()">Löschen</button><button class="action-btn btn-primary" onclick="checkExamDrawing()" style="background:var(--falling);">Einreichen ➔</button></div>`;
            setupExamCanvas();
        }

        function setupExamCanvas() {
            examCanvas = document.getElementById('examCanvas');
            examCtx = examCanvas.getContext('2d');
            examCanvas.width = examCanvas.parentElement.clientWidth; examCanvas.height = examCanvas.parentElement.clientHeight;
            examPoints = [];
            const getCoord = (e) => { const r = examCanvas.getBoundingClientRect(); return { x: (e.clientX || e.touches[0].clientX) - r.left, y: (e.clientY || e.touches[0].clientY) - r.top }; };
            examCanvas.onmousedown = (e) => { examPoints = [getCoord(e)]; examDrawingActive = true; redrawExam(); };
            examCanvas.onmousemove = (e) => { if(examDrawingActive && examPoints.length) { examPoints.push(getCoord(e)); redrawExam(); } };
            examCanvas.onmouseup = () => { examDrawingActive = false; };
            examCanvas.ontouchstart = (e) => { examPoints = [getCoord(e.touches[0])]; examDrawingActive = true; redrawExam(); e.preventDefault(); };
            examCanvas.ontouchmove = (e) => { if(examDrawingActive && examPoints.length) { examPoints.push(getCoord(e.touches[0])); redrawExam(); e.preventDefault(); } };
            examCanvas.ontouchend = () => { examDrawingActive = false; };
        }

        function clearExamCanvas() { examPoints = []; redrawExam(); }
        function redrawExam() {
            examCtx.clearRect(0, 0, examCanvas.width, examCanvas.height);
            if (examPoints.length < 2) return;
            examCtx.beginPath(); examCtx.moveTo(examPoints[0].x, examPoints[0].y);
            for(let p of examPoints) examCtx.lineTo(p.x, p.y);
            examCtx.strokeStyle = '#f8fafc'; examCtx.lineWidth = 4; examCtx.stroke();
        }

        function checkExamDrawing() {
            if (examPoints.length < 5) { playSound('wrong'); showToast("Bitte zeichnen!", false); return; }
            const correctTone = vocabs[currentExamIndex].tone;
            playSound('correct'); xp += 25; showToast("Prüfung bestanden! 🎉 +25 XP", true);
            document.getElementById('card-content-exam').innerHTML = `<div style="color: #10b981; font-size: 1.5rem; font-weight: bold;">Richtig! 🎉</div>
                <p style="color: #38bdf8; margin: 10px 0;">Gesucht war: ${toneDetails[correctTone].name}</p>
                <button class="action-btn btn-primary" onclick="loadExamCard()" style="width: 100%;">Nächste Frage ➔</button>`;
            updateHUD();
        }

        function drawGhost(ctx, canvas, tone) {
            ctx.save(); ctx.beginPath(); ctx.strokeStyle = 'rgba(71, 85, 105, 0.3)'; ctx.lineWidth = 2; ctx.setLineDash([5, 5]);
            const w = canvas.width, h = canvas.height;
            if (tone === 0) { ctx.moveTo(20, h/2); ctx.lineTo(w - 20, h/2); }
            else if (tone === 1) { ctx.moveTo(20, h/3); ctx.lineTo(w - 20, h * 0.8); }
            else if (tone === 2) { ctx.moveTo(20, h * 0.7); ctx.quadraticCurveTo(w/2, 10, w - 20, h * 0.85); }
            else if (tone === 3) { ctx.moveTo(20, h/4); ctx.lineTo(w - 20, h/4); }
            else if (tone === 4) { ctx.moveTo(20, h * 0.8); ctx.quadraticCurveTo(w/2, h, w - 20, h/4); }
            ctx.stroke(); ctx.restore();
        }

        function drawPerfectCurve(ctx, canvas, tone) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawGhost(ctx, canvas, tone);
            ctx.beginPath(); ctx.strokeStyle = '#10b981'; ctx.lineWidth = 5; ctx.lineCap = 'round';
            const w = canvas.width, h = canvas.height;
            if (tone === 0) { ctx.moveTo(20, h/2); ctx.lineTo(w - 20, h/2); }
            else if (tone === 1) { ctx.moveTo(20, h/3); ctx.lineTo(w - 20, h * 0.8); }
            else if (tone === 2) { ctx.moveTo(20, h * 0.7); ctx.quadraticCurveTo(w/2, 10, w - 20, h * 0.85); }
            else if (tone === 3) { ctx.moveTo(20, h/4); ctx.lineTo(w - 20, h/4); }
            else if (tone === 4) { ctx.moveTo(20, h * 0.8); ctx.quadraticCurveTo(w/2, h, w - 20, h/4); }
            ctx.stroke();
        }

        function renderLessons() {
            const container = document.getElementById('lessons-container');
            if (!container) return;
            let html = "";
            for (let id in lessons) {
                let l = lessons[id];
                let count = vocabs.filter(v => v.lesson == id).length;
                html += `<div class="lesson-card">
                    <div><h4 style="margin:0; color:#f8fafc;">${l.name} ${l.completed ? '⭐' : ''}</h4><p style="margin:2px 0 0 0; font-size:0.75rem; color:#94a3b8;">${count} Vokabeln</p></div>
                    <button class="action-btn btn-primary" onclick="startSessionForLesson(${id})" style="padding: 6px 12px; font-size: 0.8rem;">${l.completed ? 'Wiederholen 🔄' : 'Starten 🚀'}</button>
                </div>`;
            }
            container.innerHTML = html;
        }

        function addVocab(e) {
            e.preventDefault();
            vocabs.push({
                thai: document.getElementById('input-thai').value,
                translit: document.getElementById('input-translit').value,
                meaning: document.getElementById('input-meaning').value,
                emoji: document.getElementById('input-image').value,
                lesson: parseInt(document.getElementById('input-lesson').value),
                tone: parseInt(document.getElementById('input-tone').value)
            });
            localStorage.setItem('thai_quest_vocabs', JSON.stringify(vocabs));
            document.getElementById('add-form').reset();
            playSound('correct'); showToast("Gespeichert! 🚀", true);
            switchTab('path');
        }

        switchTab('path');
    </script>
</body>
</html>
